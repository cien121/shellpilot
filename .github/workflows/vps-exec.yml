name: VPS Exec

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Shell command to run on the VPS'
        required: true
        type: string

jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
      - name: Run command on VPS
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            root@148.135.10.19 "${{ inputs.command }}"
